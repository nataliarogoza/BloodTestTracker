{# data-search is what the filter box matches against #}
<tr id="result-{{ r.id }}" data-search="{{ (r.date ~ ' ' ~ r.test_name ~ ' ' ~ (r.category or ''))|lower }}">
    <td>{{ r.date }}</td>
    <td>{{ r.test_name }}{% if r.category %} <span class="muted small">{{ r.category }}</span>{% endif %}</td>
    <td class="num">{{ r|value }}</td>
    <td>{{ r.unit or '' }}</td>
    <td class="actions">
        <button class="icon" title="Edit" hx-get="/results/{{ r.id }}/edit" hx-target="closest tr" hx-swap="outerHTML">✎</button>
        <button class="icon danger" title="Delete"
                hx-delete="/results/{{ r.id }}" hx-target="closest tr" hx-swap="outerHTML"
                hx-confirm="Delete {{ r.test_name }} {{ r|value }} {{ r.unit or '' }} from {{ r.date }}?">🗑</button>
    </td>
</tr>
