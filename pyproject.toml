[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodtracker"
version = "0.2.0"
description = "Private, local tracker for blood test results"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only needed once, to copy data out of the old PostgreSQL database
migrate = ["psycopg2-binary>=2.9", "python-dotenv>=1.0"]
dev = ["pytest>=8", "httpx2"]

[tool.setuptools.packages.find]
include = ["bloodtracker*"]

[tool.setuptools.package-data]
bloodtracker = ["templates/*.html", "static/**/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
